<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5efe5" />
  <title>AL YAZI MANDI RESTRAUNT | Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Pirata+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2d2924;
      --muted: #81786c;
      --line: #e4d8c7;
      --paper: #f5efe5;
      --panel: #fffaf2;
      --sage: #71836b;
      --sage-dark: #31594d;
      --coral: #b95e3f;
      --gold: #c79545;
      font-family: "DM Sans", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 60% 30%, rgba(199,149,69,.18), transparent 45%),
                  radial-gradient(circle at 15% 80%, rgba(113,131,107,.12), transparent 40%),
                  var(--paper);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-brand {
      text-align: center;
      margin: 0 auto 22px;
      animation: rise .35s ease;
    }
    .login-logo-wrap {
      width: min(240px, 65vw);
      margin: 0 auto;
    }
    .login-brand-logo {
      display: block;
      width: 100%;
      height: auto;
      filter: invert(1);
      mix-blend-mode: multiply;
    }
    .login-brand-tagline {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .login-card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(45,41,36,.14);
      padding: 40px 36px 36px;
      animation: rise .35s ease;
    }
    .login-heading { margin-bottom: 6px; font: 600 28px/1.1 "Playfair Display", serif; color: var(--ink); text-align: center; }
    .login-sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; text-align: center; }
    .login-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .login-field label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .login-field select,
    .login-field input {
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: white;
      color: var(--ink);
      font: 13px "DM Sans", sans-serif;
      outline: none;
      transition: border-color .15s;
    }
    .login-field select:focus,
    .login-field input:focus { border-color: var(--sage-dark); box-shadow: 0 0 0 3px rgba(49,89,77,.1); }
    .login-error { min-height: 16px; margin-bottom: 8px; color: var(--coral); font-size: 11px; font-weight: 500; }
    .login-btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 5px;
      background: var(--sage-dark);
      color: white;
      font: 600 13px "DM Sans", sans-serif;
      cursor: pointer;
      transition: background .15s, transform .1s;
      margin-top: 4px;
    }
    .login-btn:hover { background: #29503f; }
    .login-btn:active { transform: scale(.98); }
    .login-divider { height: 1px; background: var(--line); margin: 26px 0 22px; }
    .login-footer { font-size: 11px; color: var(--muted); text-align: center; }
    .login-toggle { text-align: center; margin-top: 16px; font-size: 12px; }
    .login-toggle a { color: var(--sage-dark); font-weight: 600; text-decoration: none; }
    .login-toggle a:hover { text-decoration: underline; }
    .login-success { min-height: 16px; margin-bottom: 8px; color: var(--sage-dark); font-size: 11px; font-weight: 500; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo-wrap">
        <img class="login-brand-logo" src="al-yazi-mandi-logo.png" alt="Al Yazi Mandi" />
      </div>
      <div class="login-brand-tagline">Restaurant</div>
    </div>
    <h1 class="login-heading" hidden></h1>
    <p class="login-sub">Sign in to access the restaurant workspace.</p>
    <form id="login-form">
      <div class="login-field">
        <label for="login-user">Username</label>
        <input id="login-user" type="text" placeholder="Enter your username" required autocomplete="username" />
      </div>
      <div class="login-field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="Enter your password" required autocomplete="current-password" />
      </div>
      <p class="login-error" id="login-error"></p>
      <button class="login-btn" type="submit">Sign in →</button>
    </form>

    <form id="forgot-password-form" hidden>
      <div class="login-field">
        <label for="fp-username">Username</label>
        <input id="fp-username" type="text" placeholder="Enter your username" required autocomplete="username" />
      </div>
      <p class="login-error" id="fp-error"></p>
      <p class="login-success" id="fp-success"></p>
      <button class="login-btn" type="submit" id="fp-submit">Send reset request</button>
    </form>

    <p class="login-toggle"><a href="#" id="show-forgot-password">Forgot password?</a></p>
    <p class="login-toggle" id="show-signin" hidden><a href="#" id="back-to-signin">Back to sign in</a></p>
    <div class="login-divider"></div>
    <p class="login-footer">AL YAZI MANDI RESTRAUNT &nbsp;·&nbsp; Staff access only</p>
  </div>

  <script>
    // Check if already logged in — redirect straight to billing
    (function() {
      if (sessionStorage.getItem("alyazi-current-user")) {
        window.location.replace("/billing");
      }
    })();

    let users = JSON.parse(localStorage.getItem("alyazi-users-v1") || "null") || [
      { id: 1, name: "abu", email: "owner@alyazi.com", phone: "", role: "Super Admin", password: "admin123" }
    ];

    // One-time migration: browsers that cached the users list before the
    // Super Admin was renamed to "abu" would otherwise be stuck matching
    // against the old name forever, since the fallback above only applies
    // when nothing is cached yet.
    (function migrateSuperAdminName() {
      const seedOwner = users.find(u => u.id === 1 && u.email === "owner@alyazi.com");
      if (seedOwner && seedOwner.name !== "abu") {
        seedOwner.name = "abu";
        localStorage.setItem("alyazi-users-v1", JSON.stringify(users));
      }
    })();

    const heading = document.querySelector(".login-heading");
    const sub = document.querySelector(".login-sub");
    const loginForm = document.getElementById("login-form");
    const forgotPasswordForm = document.getElementById("forgot-password-form");
    const showForgotPasswordLink = document.getElementById("show-forgot-password");
    const backToSigninLink = document.getElementById("back-to-signin");
    const showSigninRow = document.getElementById("show-signin");
    const showForgotPasswordRow = showForgotPasswordLink.parentElement;

    const usernameInput = document.getElementById("login-user");

    document.getElementById("login-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const typedName = usernameInput.value.trim().toLowerCase();
      const user = users.find(u => u.name.trim().toLowerCase() === typedName);
      const password = document.getElementById("login-password").value;
      const errorEl = document.getElementById("login-error");

      if (!user) {
        errorEl.textContent = "Incorrect username or password. Please try again.";
        return;
      }

      if (user.locked) {
        errorEl.textContent = "This account has been locked. Contact your Super Admin.";
        return;
      }

      let passwordOk = (user.password || "admin123") === password;

      // The Super Admin password can be reset remotely via email, so when
      // online, the backend record (if one exists) is authoritative — and
      // a successful check re-caches the password locally for offline use.
      if (user.role === "Super Admin" && navigator.onLine) {
        try {
          const resp = await fetch("/api/auth/verify-superadmin", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ password }),
          });
          const data = await resp.json();
          if (data.configured) {
            passwordOk = data.ok;
            if (passwordOk) {
              user.password = password;
              localStorage.setItem("alyazi-users-v1", JSON.stringify(users));
            }
          }
        } catch (err) {
          // Network hiccup — fall back to the local check already computed above.
        }
      }

      if (!passwordOk) {
        errorEl.textContent = "Incorrect username or password. Please try again.";
        return;
      }

      errorEl.textContent = "";
      sessionStorage.setItem("alyazi-current-user", JSON.stringify(user));
      window.location.replace("/billing");
    });

    function showForgotPassword() {
      loginForm.hidden = true;
      forgotPasswordForm.hidden = false;
      showForgotPasswordRow.hidden = true;
      showSigninRow.hidden = false;
      heading.textContent = "Forgot password";
      heading.hidden = false;
      sub.textContent = "Enter your username and we'll route the reset.";
      document.getElementById("fp-username").value = "";
      document.getElementById("fp-error").textContent = "";
      document.getElementById("fp-success").textContent = "";
      document.getElementById("fp-submit").disabled = false;
    }

    function showSignin() {
      forgotPasswordForm.hidden = true;
      loginForm.hidden = false;
      showForgotPasswordRow.hidden = false;
      showSigninRow.hidden = true;
      heading.hidden = true;
      sub.textContent = "Sign in to access the restaurant workspace.";
    }

    showForgotPasswordLink.addEventListener("click", function(e) {
      e.preventDefault();
      showForgotPassword();
    });

    backToSigninLink.addEventListener("click", function(e) {
      e.preventDefault();
      showSignin();
    });

    forgotPasswordForm.addEventListener("submit", async function(e) {
      e.preventDefault();
      const typedName = document.getElementById("fp-username").value.trim();
      const user = users.find(u => u.name.trim().toLowerCase() === typedName.toLowerCase());
      const errorEl = document.getElementById("fp-error");
      const successEl = document.getElementById("fp-success");
      const submitBtn = document.getElementById("fp-submit");
      errorEl.textContent = "";
      successEl.textContent = "";

      if (!user) {
        errorEl.textContent = "No account found with that username.";
        return;
      }

      if (user.role === "Super Admin") {
        submitBtn.disabled = true;
        try {
          const resp = await fetch("/api/auth/reset-request", { method: "POST" });
          const data = await resp.json().catch(() => ({}));
          if (resp.ok && data.ok) {
            successEl.textContent = "A reset link has been sent to the Super Admin's registered email.";
          } else {
            errorEl.textContent = "Couldn't send the reset email right now. Please try again shortly.";
            submitBtn.disabled = false;
          }
        } catch (err) {
          errorEl.textContent = "Couldn't reach the server. Check your connection and try again.";
          submitBtn.disabled = false;
        }
        return;
      }

      const requests = JSON.parse(localStorage.getItem("alyazi-password-reset-requests") || "[]");
      requests.push({
        id: Date.now(),
        userId: user.id,
        userName: user.name,
        role: user.role,
        requestedAt: new Date().toISOString(),
      });
      localStorage.setItem("alyazi-password-reset-requests", JSON.stringify(requests));
      successEl.textContent = "Request sent. Ask your Super Admin to reset your password.";
      // This page runs before login, so there's no sync engine here yet —
      // push straight to the cloud so the request reaches the Super
      // Admin's device even if this one never opens the billing page.
      fetch("/api/sync/d1", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ data: { "alyazi-password-reset-requests": JSON.stringify(requests) } }),
      }).catch(function() {});
    });
  </script>
</body>
</html>
