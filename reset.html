<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5efe5" />
  <title>AL YAZI MANDI RESTRAUNT | Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "Font02";
      src: url("font 02.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --ink: #2d2924;
      --muted: #81786c;
      --line: #e4d8c7;
      --paper: #f5efe5;
      --panel: #fffaf2;
      --sage-dark: #31594d;
      --coral: #b95e3f;
      font-family: "DM Sans", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 60% 25%, rgba(199,149,69,.4), transparent 50%),
                  radial-gradient(circle at 12% 85%, rgba(113,131,107,.32), transparent 45%),
                  radial-gradient(circle at 90% 90%, rgba(185,94,63,.22), transparent 40%),
                  var(--paper);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: min(420px, 100%);
      background: rgba(255,250,242,.5);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(45,41,36,.18), inset 0 1px 0 rgba(255,255,255,.5);
      padding: 40px 36px 36px;
    }
    .login-heading { margin-bottom: 6px; font: 600 28px/1.1 "Font02", serif; color: var(--ink); }
    .login-sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
    .login-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .login-field label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .login-field input {
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: white;
      color: var(--ink);
      font: 13px "DM Sans", sans-serif;
      outline: none;
    }
    .login-error { min-height: 16px; margin-bottom: 8px; color: var(--coral); font-size: 11px; font-weight: 500; }
    .login-success { min-height: 16px; margin-bottom: 8px; color: var(--sage-dark); font-size: 11px; font-weight: 500; }
    .login-btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 5px;
      background: var(--sage-dark);
      color: white;
      font: 600 13px "DM Sans", sans-serif;
      cursor: pointer;
    }
    .login-btn:hover { background: #29503f; }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-toggle { text-align: center; margin-top: 16px; font-size: 12px; }
    .login-toggle a { color: var(--sage-dark); font-weight: 600; text-decoration: none; }
    .login-toggle a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1 class="login-heading" id="heading">Reset password</h1>
    <p class="login-sub" id="sub">Checking your reset link…</p>

    <form id="reset-form" hidden>
      <div class="login-field">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" placeholder="Enter new password" required autocomplete="new-password" />
      </div>
      <div class="login-field">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" placeholder="Confirm new password" required autocomplete="new-password" />
      </div>
      <p class="login-error" id="reset-error"></p>
      <button class="login-btn" type="submit" id="reset-submit">Update password</button>
    </form>

    <p class="login-success" id="reset-success" hidden></p>
    <p class="login-toggle"><a href="/staff/billing/">Back to sign in</a></p>
  </div>

  <script>
    const heading = document.getElementById("heading");
    const sub = document.getElementById("sub");
    const form = document.getElementById("reset-form");
    const errorEl = document.getElementById("reset-error");
    const successEl = document.getElementById("reset-success");
    const submitBtn = document.getElementById("reset-submit");

    const token = new URLSearchParams(location.search).get("token") || "";

    (async function init() {
      if (!token) {
        sub.textContent = "This reset link is missing its token.";
        return;
      }
      try {
        const resp = await fetch(`/api/auth/reset-verify?token=${encodeURIComponent(token)}`);
        const data = await resp.json();
        if (data.valid) {
          sub.textContent = "Choose a new password for the Super Admin account.";
          form.hidden = false;
        } else {
          sub.textContent = "This reset link is invalid or has expired. Request a new one from the sign-in page.";
        }
      } catch (err) {
        sub.textContent = "Couldn't reach the server. Check your connection and reload this page.";
      }
    })();

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      errorEl.textContent = "";

      if (newPassword.length < 6) {
        errorEl.textContent = "New password must be at least 6 characters.";
        return;
      }
      if (newPassword !== confirmPassword) {
        errorEl.textContent = "Passwords do not match.";
        return;
      }

      submitBtn.disabled = true;
      try {
        const resp = await fetch("/api/auth/reset-complete", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok && data.ok) {
          form.hidden = true;
          heading.textContent = "Password updated";
          sub.textContent = "";
          successEl.hidden = false;
          successEl.textContent = "You can now sign in on the restaurant terminal with your new password.";
        } else {
          errorEl.textContent = "This link is invalid or has expired. Request a new one from the sign-in page.";
          submitBtn.disabled = false;
        }
      } catch (err) {
        errorEl.textContent = "Couldn't reach the server. Check your connection and try again.";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
